Name: Cyphr
Summary: Privacy layer for messaging
Description: |
  Cyphr encrypts message content locally before you send it through
  third-party platforms such as Instagram, Discord, or any messenger.
  Two users exchange public keys (QR code or text) and encrypt
  plaintext for each other. The carrier sees only ciphertext.

  Features:
  * HPKE (X25519) + AES-256-GCM encryption
  * Multi-profile support with key rotation
  * Contact management with fingerprint verification
  * Biometric app unlock
  * Encrypted on-device storage
  * Replay protection
  * Custom keyboard IME
  * QR code scanning / generation for key exchange
  * No internet, no accounts, no analytics

